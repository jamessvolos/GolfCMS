# SG Trainer on Fly.io — one machine, one volume, SQLite.
#
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create sg_data --size 1 --region lhr --yes
#   fly deploy --image ghcr.io/jamessvolos/golfcms:latest
#
# Or `fly deploy` on its own to build the Dockerfile here instead of using
# the published image.

app = "sg-trainer"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # The volume, not the image layer. Matches the Dockerfile default.
  DATABASE_URL = "file:/data/sg.db"
  PORT = "3000"

# SG_ADMIN_SECRET gates /admin and /api/admin. It is NOT set here — it is a
# secret, and fly.toml is committed. Set it before the first deploy:
#
#   fly secrets set SG_ADMIN_SECRET=$(openssl rand -base64 24)
#
# Without it the app still serves players and returns 503 on /admin, so a
# forgotten secret is a visible failure rather than an open door.

[mounts]
  source = "sg_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true

  # SQLITE CONSTRAINT, NOT A COST CHOICE. Two machines sharing one volume is
  # impossible on Fly, and two machines with separate volumes would each hold
  # a divergent copy of every player's progress. Keep this at one machine.
  # `fly scale count 1` if it ever drifts.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # The engine's Monte Carlo runs in the browser, but grid computation on a
    # cache miss runs here and is CPU-bound for a second or two.
    hard_limit = 40
    soft_limit = 20

# Boot does `prisma migrate deploy` then seeds. A warm volume skips content
# that is already current (~2s); an empty one ingests 20 holes and warms a
# grid for each (~20s). The grace period covers the empty case.
[checks.up]
  type = "http"
  port = 3000
  method = "get"
  path = "/"
  interval = "15s"
  timeout = "5s"
  grace_period = "45s"

[[vm]]
  # Grid computation is single-threaded and CPU-bound; memory is modest.
  size = "shared-cpu-1x"
  memory = "1gb"
