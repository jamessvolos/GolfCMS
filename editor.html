<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Caddie — Hole Editor</title>
<link rel="stylesheet" href="styles/system.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; }
  #board { cursor: crosshair; }
  #verdict { font-weight: 600; color: var(--accent); min-width: 200px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header class="app-header">
  <a class="wordmark" href="index.html">Caddie 🎯</a>
  <nav>
    <a href="index.html">Play</a>
    <a href="stats.html">Career</a>
    <span class="nav-group"><span class="nav-label">Workshop</span>
      <a href="arcade.html">Arcade</a>
      <a href="editor.html" aria-current="page">Editor</a>
      <a href="cms.html">CMS</a>
      <a href="audit.html">Audit</a>
      <a href="ab.html">Blind test</a>
    </span>
  </nav>
</header>
<h1>Hole Editor</h1>
<div class="sub">Load a hole, repaint the ground, certify it, share it as a URL. Tee and cup stay put.</div>
<div id="bar" class="panel bar">
  <label>Seed <input id="seed" type="number" value="42" style="width:110px"></label>
  <select id="biome">
    <option value="classic" selected>classic</option>
    <option value="winter">winter</option>
    <option value="alpine">alpine</option>
    <option value="links">links</option>
  </select>
  <button id="load">Load</button>
  <button id="random">Random</button>
  <button id="reset">Reset edits</button>
  <button id="certify">Certify</button>
  <button id="share" disabled>Copy challenge URL</button>
  <button id="play" disabled>Play it</button>
  <span id="verdict"></span>
</div>
<div id="palette" class="panel bar"></div>
<canvas id="board" width="960" height="576"></canvas>
<footer class="app-footer">Caddie — a GolfCMS product</footer>
<script type="module" src="src/ui/editor.js"></script>
</body>
</html>
