<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔍</text></svg>">
<title>GolfCMS — Generator Audit</title>
<style>
  :root { --bg: #10241a; --panel: #1a3527; --ink: #eaf5ec; --dim: #9db8a5; --ok: #6fd08c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 14px; }
  .sub a { color: var(--ok); }
  #controls { display: flex; gap: 8px; align-items: center; background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; flex-wrap: wrap; }
  button, select { background: #234732; color: var(--ink); border: 1px solid #38664a; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .cell { background: var(--panel); border-radius: 8px; padding: 6px; }
  .cell canvas { width: 100%; border-radius: 4px; display: block; cursor: pointer; }
  .cell .meta { color: var(--dim); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<h1>GolfCMS 🔍 Generator Audit</h1>
<div class="sub">Fifty seeds at a glance — the fast human check for procedural blandness or broken layouts. Click any course to play it. <a href="index.html">Game</a> · <a href="cms.html">CMS</a></div>
<div id="controls">
  <select id="biome">
    <option value="classic" selected>classic</option>
    <option value="winter">winter</option>
    <option value="alpine">alpine</option>
    <option value="links">links</option>
  </select>
  <button id="reroll">Reroll 50</button>
  <span id="info" style="color:var(--dim);font-size:12px"></span>
</div>
<div id="grid"></div>
<script type="module" src="src/ui/audit.js"></script>
</body>
</html>
