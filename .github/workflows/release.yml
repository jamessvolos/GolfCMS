name: Publish image

# Builds the runtime image and pushes it to GitHub Container Registry, so
# deploying is `docker run` against a published tag rather than a build on
# the target host. CI already proves the image boots; this publishes the
# same Dockerfile.

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase path; the repository name is not.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publishing an image that does not boot is worse than not publishing.
      # Pull the tag that was just pushed and run it against a fresh volume,
      # which exercises migrate → seed → serve exactly as a deploy would.
      - name: Smoke-test the published image
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "testing $TAG"
          docker run -d --name sg -p 3000:3000 -v sg-data:/data "$TAG"
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/ | grep -q "SG Trainer"; then
              echo "served the hole listing after ${i}s"
              docker rm -f sg >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::published image never served the listing"
          docker logs sg
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "### Image published"
            echo
            echo '```bash'
            echo "docker run -p 3000:3000 -v sg-data:/data ${{ steps.img.outputs.name }}:${GITHUB_REF_NAME//\//-}"
            echo '```'
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
