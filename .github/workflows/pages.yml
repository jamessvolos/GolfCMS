name: Deploy to GitHub Pages

# Publishes the site by pushing main's content to the gh-pages branch.
# Branch-based Pages self-enables on the first gh-pages push and needs only
# contents: write — no repo-admin token like the artifact-based flow requires.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push origin gh-pages --force
